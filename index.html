<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pecahan Ceria - Belajar Pecahan Kelas 2 SD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #FFF8E7;
            --fg: #2D3436;
            --muted: #636E72;
            --accent: #FF6B35;
            --accent2: #2EC4B6;
            --accent3: #FFD166;
            --card: #FFFFFF;
            --border: #F0E6D3;
            --success: #06D6A0;
            --danger: #EF476F;
        }
        * { font-family: 'Nunito', sans-serif; box-sizing: border-box; }
        body { background: var(--bg); color: var(--fg); margin: 0; overflow-x: hidden; }

        /* Latar belakang mengambang */
        .bg-shapes { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .bg-shape {
            position: absolute; border-radius: 50%; opacity: 0.12;
            animation: bgfloat 18s infinite ease-in-out;
        }
        @keyframes bgfloat {
            0%,100% { transform: translateY(0) rotate(0deg) scale(1); }
            33% { transform: translateY(-25px) rotate(120deg) scale(1.05); }
            66% { transform: translateY(15px) rotate(240deg) scale(0.95); }
        }

        /* Navigasi */
        .nav-btn {
            transition: all 0.3s ease; border-radius: 12px; padding: 10px 18px;
            font-weight: 700; font-size: 0.95rem; cursor: pointer; border: none;
            background: transparent; color: var(--muted);
        }
        .nav-btn.active {
            background: var(--accent); color: #fff;
            box-shadow: 0 4px 15px rgba(255,107,53,0.4); transform: scale(1.05);
        }
        .nav-btn:hover:not(.active) { background: rgba(255,107,53,0.1); transform: translateY(-2px); }

        /* Kartu */
        .card-hover { transition: all 0.3s ease; cursor: pointer; }
        .card-hover:hover { transform: translateY(-6px); box-shadow: 0 14px 35px rgba(0,0,0,0.12); }

        /* Tab pecahan */
        .frac-tab {
            transition: all 0.3s ease; border-radius: 14px; padding: 12px 28px;
            font-weight: 800; font-size: 1.2rem; cursor: pointer; border: 3px solid transparent;
        }
        .frac-tab.active { color: #fff; transform: scale(1.08); }

        /* Konfeti */
        .confetti-piece {
            position: fixed; pointer-events: none; z-index: 9999; width: 10px; height: 10px;
            animation: confetti-fall 1.8s ease-out forwards;
        }
        @keyframes confetti-fall {
            0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
            100% { opacity: 0; transform: translateY(85vh) rotate(720deg) scale(0.3); }
        }

        /* Animasi */
        .slide-up { animation: slide-up 0.5s ease-out; }
        @keyframes slide-up { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
        .bounce-in { animation: bounce-in 0.6s ease-out; }
        @keyframes bounce-in { 0%{transform:scale(0);} 50%{transform:scale(1.15);} 70%{transform:scale(0.95);} 100%{transform:scale(1);} }
        .shake { animation: shake 0.5s ease-in-out; }
        @keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-8px);} 40%{transform:translateX(8px);} 60%{transform:translateX(-8px);} 80%{transform:translateX(8px);} }
        .star-pop { animation: star-pop 0.5s ease-out; }
        @keyframes star-pop { 0%{transform:scale(0);} 50%{transform:scale(1.4);} 100%{transform:scale(1);} }
        .pulse-gentle { animation: pulse-gentle 2s infinite ease-in-out; }
        @keyframes pulse-gentle { 0%,100%{transform:scale(1);} 50%{transform:scale(1.03);} }
        .reward-msg { animation: reward-appear 0.8s ease-out; }
        @keyframes reward-appear { 0%{transform:scale(0) rotate(-10deg);opacity:0;} 50%{transform:scale(1.2) rotate(5deg);opacity:1;} 100%{transform:scale(1) rotate(0);opacity:1;} }

        .progress-fill { transition: width 0.5s ease-out; }

        canvas { cursor: pointer; max-width: 100%; }

        /* Kartu memori */
        .memory-card { perspective: 700px; cursor: pointer; }
        .memory-card-inner {
            transition: transform 0.5s; transform-style: preserve-3d;
            position: relative; width: 100%; height: 100%;
        }
        .memory-card.flipped .memory-card-inner { transform: rotateY(180deg); }
        .memory-card.matched .memory-card-inner { transform: rotateY(180deg); }
        .memory-card-front, .memory-card-back {
            position: absolute; inset: 0; backface-visibility: hidden;
            border-radius: 14px; display: flex; align-items: center; justify-content: center;
            flex-direction: column;
        }
        .memory-card-front { transform: rotateY(180deg); }
        .memory-card-back { background: linear-gradient(135deg, var(--accent), #FF8C5A); }

        /* Toast */
        .toast-item {
            animation: toast-in 0.4s ease-out;
        }
        @keyframes toast-in { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
        @media (max-width: 640px) {
            .nav-btn { padding: 8px 12px; font-size: 0.82rem; }
            .frac-tab { padding: 10px 18px; font-size: 1rem; }
        }
    </style>
</head>
<body class="min-h-screen">

<!-- Bentuk latar belakang mengambang -->
<div class="bg-shapes" id="bgShapes"></div>

<!-- Navigasi -->
<nav class="sticky top-0 z-50 backdrop-blur-md bg-white/80 border-b border-orange-100 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-2">
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-orange-400 to-teal-400 flex items-center justify-center">
                <i class="fas fa-shapes text-white text-sm"></i>
            </div>
            <span class="font-black text-lg text-orange-600 hidden sm:inline">Pecahan Ceria</span>
        </div>
        <div class="flex gap-1 flex-wrap" id="navBtns">
            <button class="nav-btn active" data-section="beranda" onclick="showSection('beranda')">
                <i class="fas fa-home mr-1"></i>Beranda
            </button>
            <button class="nav-btn" data-section="belajar" onclick="showSection('belajar')">
                <i class="fas fa-book-open mr-1"></i>Belajar
            </button>
            <button class="nav-btn" data-section="latihan" onclick="showSection('latihan')">
                <i class="fas fa-palette mr-1"></i>Latihan
            </button>
            <button class="nav-btn" data-section="kuis" onclick="showSection('kuis')">
                <i class="fas fa-star mr-1"></i>Kuis
            </button>
            <button class="nav-btn" data-section="permainan" onclick="showSection('permainan')">
                <i class="fas fa-gamepad mr-1"></i>Permainan
            </button>
        </div>
        <div class="flex items-center gap-1 bg-yellow-100 rounded-full px-3 py-1.5">
            <i class="fas fa-star text-yellow-500"></i>
            <span class="font-black text-yellow-700" id="starCount">0</span>
        </div>
    </div>
</nav>

<!-- Konten Utama -->
<main class="relative z-10 max-w-5xl mx-auto px-4 py-6" id="app"></main>

<!-- Toast Container -->
<div class="fixed top-20 right-4 z-50 flex flex-col gap-2" id="toastContainer"></div>

<script>
// ============================================
// STATE GLOBAL
// ============================================
const state = {
    currentSection: 'beranda',
    stars: 0,
    // Belajar
    belajarFrac: '1/2',
    belajarStep: 0,
    belajarAnimTimer: null,
    // Latihan
    latihan: { targetN: 1, targetD: 2, coloredParts: [], shape: 'circle', checked: false, isCorrect: false },
    // Kuis
    kuis: { questions: [], current: 0, score: 0, answered: false, isCorrect: false, finished: false },
    // Permainan
    game: { cards: [], flipped: [], matched: 0, moves: 0, locked: false, totalPairs: 3 }
};

// Warna pecahan
const FRAC_COLORS = {
    '1/2': '#FF6B35',
    '1/3': '#2EC4B6',
    '1/4': '#E6A817'
};
const FRAC_LIGHT = {
    '1/2': '#FFDCC8',
    '1/3': '#C8F5F0',
    '1/4': '#FFF3C4'
};
const FRAC_NAMES = {
    '1/2': 'Setengah',
    '1/3': 'Sepertiga',
    '1/4': 'Seperempat'
};
const FRAC_NUM = { '1/2': [1,2], '1/3': [1,3], '1/4': [1,2] }; // tidak dipakai, gunakan split

// ============================================
// AUDIO (Web Audio API)
// ============================================
let audioCtx = null;
function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}
function playTone(freq, dur, type='sine', vol=0.25) {
    try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = vol;
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + dur);
    } catch(e) {}
}
function sfxCorrect() { playTone(523,0.12); setTimeout(()=>playTone(659,0.15),120); setTimeout(()=>playTone(784,0.2),240); }
function sfxWrong() { playTone(330,0.15); setTimeout(()=>playTone(262,0.2),150); }
function sfxClick() { playTone(880,0.04,'sine',0.12); }
function sfxCelebrate() { playTone(523,0.08); setTimeout(()=>playTone(659,0.08),80); setTimeout(()=>playTone(784,0.08),160); setTimeout(()=>playTone(1047,0.25),240); }

// ============================================
// UTILITAS
// ============================================
function addStars(n) {
    state.stars += n;
    const el = document.getElementById('starCount');
    if (el) { el.textContent = state.stars; el.classList.remove('star-pop'); void el.offsetWidth; el.classList.add('star-pop'); }
}
function showToast(msg, type='success') {
    const c = document.getElementById('toastContainer');
    const colors = { success: 'bg-green-500', error: 'bg-red-400', info: 'bg-blue-400' };
    const div = document.createElement('div');
    div.className = `toast-item ${colors[type]||colors.info} text-white px-5 py-3 rounded-xl font-bold shadow-lg text-sm`;
    div.textContent = msg;
    c.appendChild(div);
    setTimeout(() => { div.style.opacity='0'; div.style.transition='opacity 0.3s'; setTimeout(()=>div.remove(),300); }, 2200);
}
function spawnConfetti(count=30) {
    const colors = ['#FF6B35','#2EC4B6','#FFD166','#06D6A0','#EF476F','#845EC2'];
    for (let i=0;i<count;i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = Math.random()*100+'vw';
        el.style.top = '-10px';
        el.style.background = colors[Math.floor(Math.random()*colors.length)];
        el.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
        el.style.width = (6+Math.random()*8)+'px';
        el.style.height = (6+Math.random()*8)+'px';
        el.style.animationDuration = (1.2+Math.random()*1)+'s';
        el.style.animationDelay = (Math.random()*0.5)+'s';
        document.body.appendChild(el);
        setTimeout(()=>el.remove(), 3000);
    }
}
function shuffle(arr) {
    const a = [...arr];
    for (let i=a.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
}

// ============================================
// GAMBAR CANVAS - PECAHAN
// ============================================
function setupCanvas(canvas, w, h) {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    return ctx;
}

function drawCircleFrac(canvas, denom, coloredIndices, fracKey, highlightIdx=-1) {
    const w = parseInt(canvas.style.width) || 260;
    const h = parseInt(canvas.style.height) || 260;
    const ctx = setupCanvas(canvas, w, h);
    const cx = w/2, cy = h/2;
    const radius = Math.max(10, Math.min(w,h)/2 - 25);
    const sectorAngle = (2*Math.PI)/denom;
    const startAngle = -Math.PI/2;
    const color = FRAC_COLORS[fracKey] || '#FF6B35';
    const light = FRAC_LIGHT[fracKey] || '#FFE0CC';

    ctx.clearRect(0,0,w,h);

    // Bagian yang diwarnai
    for (const i of coloredIndices) {
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, startAngle + i*sectorAngle, startAngle + (i+1)*sectorAngle);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
    }

    // Bagian tidak diwarnai
    for (let i=0; i<denom; i++) {
        if (!coloredIndices.includes(i)) {
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, radius, startAngle + i*sectorAngle, startAngle + (i+1)*sectorAngle);
            ctx.closePath();
            ctx.fillStyle = light;
            ctx.fill();
        }
    }

    // Garis pembagi
    for (let i=0; i<denom; i++) {
        const angle = startAngle + i*sectorAngle;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + radius*Math.cos(angle), cy + radius*Math.sin(angle));
        ctx.strokeStyle = '#2D3436';
        ctx.lineWidth = 2.5;
        ctx.stroke();
    }

    // Lingkaran luar
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, 2*Math.PI);
    ctx.strokeStyle = '#2D3436';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Highlight hover
    if (highlightIdx >= 0 && highlightIdx < denom) {
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, radius, startAngle + highlightIdx*sectorAngle, startAngle + (highlightIdx+1)*sectorAngle);
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fill();
    }

    // Label di setiap bagian
    for (let i=0; i<denom; i++) {
        const midAngle = startAngle + (i+0.5)*sectorAngle;
        const lx = cx + (radius*0.6)*Math.cos(midAngle);
        const ly = cy + (radius*0.6)*Math.sin(midAngle);
        ctx.fillStyle = coloredIndices.includes(i) ? '#fff' : '#555';
        ctx.font = 'bold 16px Nunito';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('1/'+denom, lx, ly);
    }
}

function drawRectFrac(canvas, denom, coloredIndices, fracKey, highlightIdx=-1) {
    const w = parseInt(canvas.style.width) || 320;
    const h = parseInt(canvas.style.height) || 140;
    const ctx = setupCanvas(canvas, w, h);
    const pad = 15;
    const rw = w - pad*2;
    const rh = h - pad*2;
    const partW = rw / denom;
    const color = FRAC_COLORS[fracKey] || '#FF6B35';
    const light = FRAC_LIGHT[fracKey] || '#FFE0CC';

    ctx.clearRect(0,0,w,h);

    for (let i=0; i<denom; i++) {
        const x = pad + i*partW;
        ctx.fillStyle = coloredIndices.includes(i) ? color : light;
        ctx.fillRect(x, pad, partW, rh);

        if (i === highlightIdx) {
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.fillRect(x, pad, partW, rh);
        }

        ctx.strokeStyle = '#2D3436';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(x, pad, partW, rh);

        ctx.fillStyle = coloredIndices.includes(i) ? '#fff' : '#555';
        ctx.font = 'bold 16px Nunito';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('1/'+denom, x + partW/2, pad + rh/2);
    }

    // Garis luar keseluruhan
    ctx.strokeStyle = '#2D3436';
    ctx.lineWidth = 3;
    ctx.strokeRect(pad, pad, rw, rh);
}

// Deteksi klik pada sektor lingkaran
function getCircleSector(canvas, e, denom) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = parseInt(canvas.style.width) / rect.width;
    const scaleY = parseInt(canvas.style.height) / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;
    const w = parseInt(canvas.style.width);
    const h = parseInt(canvas.style.height);
    const cx = w/2, cy = h/2;
    const radius = Math.max(10, Math.min(w,h)/2 - 25);
    const dx = mx - cx, dy = my - cy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > radius || dist < 5) return -1;
    let angle = Math.atan2(dy, dx) + Math.PI/2;
    if (angle < 0) angle += 2*Math.PI;
    const sectorAngle = (2*Math.PI)/denom;
    return Math.floor(angle / sectorAngle);
}

// Deteksi klik pada bagian persegi panjang
function getRectPart(canvas, e, denom) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = parseInt(canvas.style.width) / rect.width;
    const scaleY = parseInt(canvas.style.height) / rect.height;
    const mx = (e.clientX - rect.left) * scaleX;
    const my = (e.clientY - rect.top) * scaleY;
    const w = parseInt(canvas.style.width);
    const h = parseInt(canvas.style.height);
    const pad = 15;
    const rw = w - pad*2;
    const rh = h - pad*2;
    const partW = rw / denom;
    if (my < pad || my > pad+rh || mx < pad || mx > pad+rw) return -1;
    return Math.floor((mx - pad) / partW);
}

// Gambar pecahan kecil untuk kuis/permainan (canvas kecil)
function drawMiniCircle(canvas, denom, coloredN, fracKey) {
    const w = 120, h = 120;
    const ctx = setupCanvas(canvas, w, h);
    const cx=w/2, cy=h/2, r=45;
    const sa = (2*Math.PI)/denom;
    const st = -Math.PI/2;
    const colored = Array.from({length:coloredN},(_,i)=>i);
    const color = FRAC_COLORS[fracKey]||'#FF6B35';
    const light = FRAC_LIGHT[fracKey]||'#FFE0CC';

    for(let i=0;i<denom;i++){
        ctx.beginPath(); ctx.moveTo(cx,cy);
        ctx.arc(cx,cy,r,st+i*sa,st+(i+1)*sa); ctx.closePath();
        ctx.fillStyle = colored.includes(i)?color:light; ctx.fill();
    }
    for(let i=0;i<denom;i++){
        const a=st+i*sa;
        ctx.beginPath(); ctx.moveTo(cx,cy);
        ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));
        ctx.strokeStyle='#2D3436'; ctx.lineWidth=2; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(cx,cy,r,0,2*Math.PI);
    ctx.strokeStyle='#2D3436'; ctx.lineWidth=2.5; ctx.stroke();
}

// ============================================
// NAVIGASI
// ============================================
function showSection(name) {
    if (state.belajarAnimTimer) { clearTimeout(state.belajarAnimTimer); state.belajarAnimTimer = null; }
    state.currentSection = name;
    const app = document.getElementById('app');

    switch(name) {
        case 'beranda': app.innerHTML = renderBeranda(); break;
        case 'belajar': app.innerHTML = renderBelajar(); initBelajar(); break;
        case 'latihan': app.innerHTML = renderLatihan(); initLatihan(); break;
        case 'kuis': startKuis(); break;
        case 'permainan': app.innerHTML = renderPermainan(); initPermainan(); break;
    }
    updateNav();
    window.scrollTo({top:0, behavior:'smooth'});
}

function updateNav() {
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.section === state.currentSection);
    });
}

// ============================================
// BERANDA
// ============================================
function renderBeranda() {
    return `
    <div class="slide-up text-center py-8">
        <div class="inline-block mb-4">
            <div class="w-24 h-24 rounded-3xl bg-gradient-to-br from-orange-400 via-teal-400 to-yellow-400 flex items-center justify-center mx-auto shadow-lg pulse-gentle">
                <i class="fas fa-shapes text-white text-4xl"></i>
            </div>
        </div>
        <h1 class="text-4xl sm:text-5xl font-black mb-3" style="color:var(--accent)">Pecahan Ceria</h1>
        <p class="text-lg text-gray-500 font-semibold mb-8 max-w-md mx-auto">Ayo belajar pecahan <span class="text-orange-500">1/2</span>, <span class="text-teal-500">1/3</span>, dan <span class="text-yellow-500">1/4</span> dengan cara yang menyenangkan!</p>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 max-w-2xl mx-auto mb-10">
            <div class="card-hover bg-white rounded-2xl p-5 shadow-md border-2 border-orange-100" onclick="showSection('belajar')">
                <div class="w-14 h-14 rounded-xl bg-orange-100 flex items-center justify-center mx-auto mb-3">
                    <i class="fas fa-book-open text-orange-500 text-xl"></i>
                </div>
                <div class="font-extrabold text-gray-700 text-sm">Belajar</div>
                <div class="text-xs text-gray-400 mt-1">Pelajari pecahan</div>
            </div>
            <div class="card-hover bg-white rounded-2xl p-5 shadow-md border-2 border-teal-100" onclick="showSection('latihan')">
                <div class="w-14 h-14 rounded-xl bg-teal-100 flex items-center justify-center mx-auto mb-3">
                    <i class="fas fa-palette text-teal-500 text-xl"></i>
                </div>
                <div class="font-extrabold text-gray-700 text-sm">Latihan</div>
                <div class="text-xs text-gray-400 mt-1">Warnai pecahan</div>
            </div>
            <div class="card-hover bg-white rounded-2xl p-5 shadow-md border-2 border-yellow-100" onclick="showSection('kuis')">
                <div class="w-14 h-14 rounded-xl bg-yellow-100 flex items-center justify-center mx-auto mb-3">
                    <i class="fas fa-star text-yellow-500 text-xl"></i>
                </div>
                <div class="font-extrabold text-gray-700 text-sm">Kuis</div>
                <div class="text-xs text-gray-400 mt-1">Uji pemahaman</div>
            </div>
            <div class="card-hover bg-white rounded-2xl p-5 shadow-md border-2 border-pink-100" onclick="showSection('permainan')">
                <div class="w-14 h-14 rounded-xl bg-pink-100 flex items-center justify-center mx-auto mb-3">
                    <i class="fas fa-gamepad text-pink-500 text-xl"></i>

let belajarInteractCircleParts = [];
let belajarInteractRectParts = [];

function switchBelajar(frac) {
    state.belajarFrac = frac;
    state.belajarStep = 0;
    belajarInteractCircleParts = [];
    belajarInteractRectParts = [];
    showSection('belajar');
}

function initBelajar() {
    const frac = state.belajarFrac;
    const [n, d] = frac.split('/').map(Number);
    const color = FRAC_COLORS[frac];
    const light = FRAC_LIGHT[frac];
    const name = FRAC_NAMES[frac];

    // Info
    const info = document.getElementById('belajarInfo');
    if (info) {
        info.innerHTML = `
        <div class="bounce-in">
            <div class="text-5xl font-black mb-2" style="color:${color}">${frac}</div>
            <div class="text-xl font-bold text-gray-600 mb-2">${name}</div>
            <p class="text-gray-500 font-semibold">
                ${frac} berarti <strong style="color:${color}">${n} bagian</strong> dari <strong>${d} bagian yang sama besar</strong>.
                <br>Satu bentuk dibagi menjadi ${d} bagian sama rata, lalu ${n} bagian diwarnai.
            </p>
        </div>`;
    }

    // Gambar visualisasi utama dengan animasi
    let animStep = 0;
    const maxSteps = d + 1;

    function animStep_fn() {
        const cc = document.getElementById('belajarCircle');
        const cr = document.getElementById('belajarRect');
        if (!cc || !cr) return;

        if (animStep === 0) {
            // Kosong semua
            drawCircleFrac(cc, d, [], frac);
            drawRectFrac(cr, d, [], frac);
        } else if (animStep <= d) {
            // Munculkan bagian satu per satu
            const colored = [];
            for (let i = 0; i < animStep; i++) colored.push(i);
            drawCircleFrac(cc, d, colored, frac);
            drawRectFrac(cr, d, colored, frac);
        }
        animStep++;
        if (animStep <= d) {
            state.belajarAnimTimer = setTimeout(animStep_fn, 400);
        } else {
            // Akhir: tampilkan pecahan yang benar
            setTimeout(() => {
                const colored = Array.from({length:n},(_,i)=>i);
                drawCircleFrac(cc, d, colored, frac);
                drawRectFrac(cr, d, colored, frac);
            }, 400);
        }
    }

    // Reset dan mulai animasi
    const cc = document.getElementById('belajarCircle');
    const cr = document.getElementById('belajarRect');
    if (cc) drawCircleFrac(cc, d, [], frac);
    if (cr) drawRectFrac(cr, d, [], frac);
    state.belajarAnimTimer = setTimeout(animStep_fn, 300);

    // Interaktif
    belajarInteractCircleParts = [];
    belajarInteractRectParts = [];
    const instrEl = document.getElementById('belajarInteractInstr');
    if (instrEl) instrEl.textContent = `Klik bagian untuk mewarnai pecahan ${frac}`;

    const ic = document.getElementById('belajarInteractCircle');
    const ir = document.getElementById('belajarInteractRect');
    if (ic) {
        drawCircleFrac(ic, d, [], frac);
        ic.onclick = function(e) {
            sfxClick();
            const sector = getCircleSector(ic, e, d);
            if (sector < 0) return;
            const idx = belajarInteractCircleParts.indexOf(sector);
            if (idx >= 0) belajarInteractCircleParts.splice(idx,1);
            else belajarInteractCircleParts.push(sector);
            drawCircleFrac(ic, d, belajarInteractCircleParts, frac);
            checkBelajarInteract();
        };
        ic.onmousemove = function(e) {
            const sector = getCircleSector(ic, e, d);
            drawCircleFrac(ic, d, belajarInteractCircleParts, frac, sector);
        };
        ic.onmouseleave = function() {
            drawCircleFrac(ic, d, belajarInteractCircleParts, frac);
        };
    }
    if (ir) {
        drawRectFrac(ir, d, [], frac);
        ir.onclick = function(e) {
            sfxClick();
            const part = getRectPart(ir, e, d);
            if (part < 0) return;
            const idx = belajarInteractRectParts.indexOf(part);
            if (idx >= 0) belajarInteractRectParts.splice(idx,1);
            else belajarInteractRectParts.push(part);
            drawRectFrac(ir, d, belajarInteractRectParts, frac);
            checkBelajarInteract();
        };
        ir.onmousemove = function(e) {
            const part = getRectPart(ir, e, d);
            drawRectFrac(ir, d, belajarInteractRectParts, frac, part);
        };
        ir.onmouseleave = function() {
            drawRectFrac(ir, d, belajarInteractRectParts, frac);
        };
    }
}

function checkBelajarInteract() {
    const frac = state.belajarFrac;
    const [n,d] = frac.split('/').map(Number);
    const circleOk = belajarInteractCircleParts.length === n;

// KUIS
// ============================================
function generateKuisQuestions() {
    const questions = [];
    const fracs = ['1/2','1/3','1/4'];
    const shapes = ['circle','rect'];
    // 8 pertanyaan
    for (let i=0; i<8; i++) {
        const frac = fracs[i % 3];
        const [n,d] = frac.split('/').map(Number);
        // Tampilkan pecahan dengan bagian berwarna acak
        const coloredCount = n;
        // Opsi: pecahan yang benar + 2 yang salah
        const options = [frac];
        const others = fracs.filter(f=>f!==frac);
        options.push(others[0], others[1]);
        // Acak urutan opsi
        questions.push({
            frac, numerator:n, denominator:d, coloredCount,
            options: shuffle(options),
            shape: shapes[i%2]
        });
    }
    return questions;
}

function startKuis() {
    state.kuis = { questions: generateKuisQuestions(), current:0, score:0, answered:false, isCorrect:false, finished:false };
    renderKuisQuestion();
}

function renderKuisQuestion() {
    const k = state.kuis;
    if (k.current >= k.questions.length) { renderKuisResult(); return; }
    const q = k.questions[k.current];
    const app = document.getElementById('app');
    const progress = ((k.current) / k.questions.length * 100);

    app.innerHTML = `
    <div class="slide-up">
        <h2 class="text-2xl sm:text-3xl font-black text-center mb-2" style="color:var(--accent3)">Kuis Pecahan</h2>
        <div class="flex items-center justify-between mb-4 max-w-md mx-auto">
            <span class="font-bold text-gray-500">Soal ${k.current+1} dari ${k.questions.length}</span>
            <span class="font-bold text-yellow-600"><i class="fas fa-star mr-1"></i>${k.score} benar</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-3 mb-6 max-w-md mx-auto">
            <div class="progress-fill h-3 rounded-full" style="width:${progress}%;background:var(--accent3)"></div>
        </div>

        <div class="bg-white rounded-2xl p-6 shadow-md mb-6 text-center">
            <p class="text-lg font-bold text-gray-600 mb-4">Pecahan apa yang ditunjukkan oleh bagian berwarna?</p>
            <canvas id="kuisCanvas" style="width:200px;height:200px;margin:0 auto;display:block;cursor:default"></canvas>
        </div>

        <div class="flex justify-center gap-3 flex-wrap mb-4" id="kuisOptions">
            ${q.options.map((opt,i)=>`
                <button onclick="answerKuis('${opt}')" id="kuisOpt${i}" class="px-8 py-4 rounded-xl font-extrabold text-xl shadow-md transition hover:scale-105 border-3" style="background:${FRAC_LIGHT[opt]};color:${FRAC_COLORS[opt]};border:3px solid ${FRAC_COLORS[opt]}40">
                    ${opt}
                </button>
            `).join('')}
        </div>
        <div id="kuisFeedback" class="text-center mb-4"></div>
        <div class="text-center" id="kuisNextWrap" style="display:none">
            <button onclick="nextKuisQuestion()" class="px-8 py-3 rounded-xl font-bold text-white shadow-md transition hover:scale-105" style="background:var(--accent)">
                Soal Berikutnya <i class="fas fa-arrow-right ml-2"></i>
            </button>
        </div>
    </div>`;

    // Gambar canvas
    setTimeout(()=>{
        const c = document.getElementById('kuisCanvas');
        if (!c) return;
        const frac = q.frac;
        if (q.shape === 'circle') {
            drawCircleFrac(c, q.denominator, Array.from({length:q.coloredCount},(_,i)=>i), frac);
        } else {
            c.style.width = '300px';
            c.style.height = '130px';
            drawRectFrac(c, q.denominator, Array.from({length:q.coloredCount},(_,i)=>i), frac);
        }
    }, 50);
}

function answerKuis(answer) {
    const k = state.kuis;
    if (k.answered) return;
    k.answered = true;
    const q = k.questions[k.current];
    k.isCorrect = (answer === q.frac);

    const fb = document.getElementById('kuisFeedback');
    const nextWrap = document.getElementById('kuisNextWrap');

    // Sorot jawaban
    q.options.forEach((opt,i)=>{
        const btn = document.getElementById('kuisOpt'+i);
        if (!btn) return;
        btn.style.pointerEvents = 'none';
        if (opt === q.frac) {
            btn.style.background = '#06D6A0';
            btn.style.color = '#fff';
            btn.style.borderColor = '#06D6A0';
        } else if (opt === answer && !k.isCorrect) {
            btn.style.background = '#EF476F';
            btn.style.color = '#fff';
            btn.style.borderColor = '#EF476F';
            btn.classList.add('shake');
        }
    });

    if (k.isCorrect) {
        k.score++;
        sfxCorrect();
        fb.innerHTML = `<div class="bounce-in inline-block bg-green-100 text-green-700 px-5 py-2 rounded-xl font-extrabold"><i class="fas fa-check-circle mr-2"></i>Benar!</div>`;
        addStars(1);
    } else {
        sfxWrong();
        fb.innerHTML = `<div class="shake inline-block bg-red-100 text-red-600 px-5 py-2 rounded-xl font-bold"><i class="fas fa-times-circle mr-2"></i>Yang benar adalah ${q.frac}</div>`;
    }
    nextWrap.style.display = 'block';
}

function nextKuisQuestion() {
    sfxClick();
    state.kuis.current++;
    state.kuis.answered = false;
    state.kuis.isCorrect = false;
    renderKuisQuestion();
}

function renderKuisResult() {
    const k = state.kuis;
    k.finished = true;
    const pct = Math.round(k.score / k.questions.length * 100);
    let msg = '', msgClass = '';
    if (pct >= 80) { msg = 'Luar biasa! Kamu sangat pintar!'; msgClass = 'text-green-600'; sfxCelebrate(); spawnConfetti(40); addStars(3); }
    else if (pct >= 50) { msg = 'Bagus! Terus belajar ya!'; msgClass = 'text-yellow-600'; sfxCorrect(); addStars(1); }
    else { msg = 'Jangan menyerah! Ayo coba lagi!'; msgClass = 'text-orange-500'; }

    const app = document.getElementById('app');
    app.innerHTML = `
    <div class="slide-up text-center">
        <div class="bg-white rounded-2xl p-8 shadow-lg max-w-md mx-auto">
            <div class="text-6xl font-black mb-4 ${msgClass}">${k.score}/${k.questions.length}</div>
            <div class="text-xl font-bold ${msgClass} mb-4">${msg}</div>
            <div class="flex justify-center gap-1 mb-6">
                ${Array.from({length:k.questions.length},(_,i) =>

                ).join('')}
            </div>
            <div class="flex justify-center gap-3 flex-wrap">
                <button onclick="startKuis()" class="px-6 py-3 rounded-xl font-bold text-white shadow-md transition hover:scale-105" style="background:var(--accent3)">
                    <i class="fas fa-redo mr-2"></i>Main Lagi

    <div class="slide-up">
        <h2 class="text-2xl sm:text-3xl font-black text-center mb-2" style="color:var(--danger)">Cocokkan Pecahan</h2>
        <p class="text-center text-gray-500 font-semibold mb-4">Temukan pasangan pecahan yang sama! Klik dua kartu untuk mencocokkan.</p>

        <div class="flex items-center justify-center gap-6 mb-6">
            <div class="bg-white rounded-xl px-4 py-2 shadow-sm">
                <span class="font-bold text-gray-500">Langkah: </span>
                <span class="font-extrabold text-pink-500" id="gameMoves">0</span>
            </div>
            <div class="bg-white rounded-xl px-4 py-2 shadow-sm">
                <span class="font-bold text-gray-500">Cocok: </span>
                <span class="font-extrabold text-green-500" id="gameMatched">0</span>/<span class="font-bold">${state.game.totalPairs}</span>
            </div>
        </div>

        <div class="grid grid-cols-3 sm:grid-cols-6 gap-3 max-w-xl mx-auto mb-6" id="gameGrid">
        </div>

        <div id="gameFeedback" class="text-center mb-4"></div>

        <div class="text-center">
            <button onclick="initPermainan()" class="px-6 py-3 rounded-xl font-bold text-white shadow-md transition hover:scale-105" style="background:var(--danger)">
                <i class="fas fa-redo mr-2"></i>Main Ulang
            </button>
        </div>
    </div>`;
}

function initPermainan() {
    const fracs = ['1/2','1/3','1/4'];
    // Buat kartu: 3 visual + 3 angka = 6 kartu
    const cards = [];
    fracs.forEach((f,i)=>{
        cards.push({ id: i*2, type:'visual', frac:f, matched:false });
        cards.push({ id: i*2+1, type:'number', frac:f, matched:false });
    });
    state.game = { cards: shuffle(cards), flipped:[], matched:0, moves:0, locked:false, totalPairs:3 };

    const grid = document.getElementById('gameGrid');
    if (!grid) return;
    grid.innerHTML = '';

    state.game.cards.forEach((card, idx)=>{
        const div = document.createElement('div');
        div.className = 'memory-card';
        div.style.height = '120px';
        div.id = 'gameCard'+idx;
        div.onclick = ()=>flipGameCard(idx);

        const frontContent = card.type === 'visual'
            ? `<canvas class="game-mini-canvas" data-frac="${card.frac}" style="width:80px;height:80px;cursor:default"></canvas>`
            : `<div class="text-2xl font-black" style="color:${FRAC_COLORS[card.frac]}">${card.frac}</div>`;

        div.innerHTML = `
        <div class="memory-card-inner">
            <div class="memory-card-front bg-white border-2 shadow-md" style="border-color:${FRAC_COLORS[card.frac]}40">
                ${frontContent}
            </div>
            <div class="memory-card-back">
                <i class="fas fa-question text-white text-2xl"></i>
            </div>
        </div>`;
        grid.appendChild(div);
    });

    // Gambar mini canvas
    setTimeout(()=>{
        document.querySelectorAll('.game-mini-canvas').forEach(c=>{
            const frac = c.dataset.frac;
            const [n,d] = frac.split('/').map(Number);
            drawMiniCircle(c, d, n, frac);
        });
    },100);

    // Reset tampilan
    const movesEl = document.getElementById('gameMoves');
    const matchedEl = document.getElementById('gameMatched');
    if(movesEl) movesEl.textContent = '0';
    if(matchedEl) matchedEl.textContent = '0';
    const fb = document.getElementById('gameFeedback');
    if(fb) fb.innerHTML = '';
}

function flipGameCard(idx) {
    const g = state.game;
    if (g.locked) return;
    if (g.cards[idx].matched) return;
    if (g.flipped.includes(idx)) return;
    if (g.flipped.length >= 2) return;

    sfxClick();
    g.flipped.push(idx);
    const el = document.getElementById('gameCard'+idx);
    if (el) el.classList.add('flipped');

    if (g.flipped.length === 2) {
        g.moves++;
        const movesEl = document.getElementById('gameMoves');
        if(movesEl) movesEl.textContent = g.moves;

        const [i1, i2] = g.flipped;
        const c1 = g.cards[i1], c2 = g.cards[i2];

        if (c1.frac === c2.frac && c1.type !== c2.type) {
            // Cocok!
            g.locked = true;
            setTimeout(()=>{
                c1.matched = true; c2.matched = true;
                g.matched++;
                const matchedEl = document.getElementById('gameMatched');
                if(matchedEl) matchedEl.textContent = g.matched;
                document.getElementById('gameCard'+i1)?.classList.add('matched');
                document.getElementById('gameCard'+i2)?.classList.add('matched');

                // Efek
                sfxCorrect();
                showToast('Cocok! ' + c1.frac, 'success');

                g.flipped = [];
                g.locked = false;

                if (g.matched >= g.totalPairs) {
                    setTimeout(()=>{
                        sfxCelebrate(); spawnConfetti(35); addStars(3);
                        const fb = document.getElementById('gameFeedback');
                        if(fb) fb.innerHTML = `<div class="reward-msg inline-block bg-green-100 text-green-700 px-6 py-3 rounded-xl font-extrabold text-lg"><i class="fas fa-trophy mr-2"></i>Semua cocok! Kamu hebat!</div>`;
                    },400);
                }
            },500);
        } else {
            // Tidak cocok
            g.locked = true;
            setTimeout(()=>{
                sfxWrong();
                document.getElementById('gameCard'+i1)?.classList.remove('flipped');
                document.getElementById('gameCard'+i2)?.classList.remove('flipped');
                g.flipped = [];
                g.locked = false;
            },900);
        }
    }
}

// ============================================
// BENTUK LATAR BELAKANG
// ============================================
function createBgShapes() {
    const container = document.getElementById('bgShapes');
    if (!container) return;
    const colors = ['#FF6B35','#2EC4B6','#FFD166','#06D6A0','#EF476F'];
    for (let i=0; i<12; i++) {
        const shape = document.createElement('div');
        shape.className = 'bg-shape';
        const size = 30 + Math.random()*80;
        shape.style.width = size+'px';
        shape.style.height = size+'px';
        shape.style.background = colors[Math.floor(Math.random()*colors.length)];
        shape.style.left = Math.random()*100+'%';
        shape.style.top = Math.random()*100+'%';
        shape.style.animationDelay = (-Math.random()*18)+'s';
        shape.style.animationDuration = (14+Math.random()*10)+'s';
        container.appendChild(shape);
    }
}

// ============================================
// INISIALISASI
// ============================================
function init() {
    createBgShapes();
    generateLatihanTarget();
    showSection('beranda');
    // Preview beranda perlu diinisialisasi setelah render
    setTimeout(initBerandaPreviews, 100);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
